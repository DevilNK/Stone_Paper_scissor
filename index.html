<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>STONE PAPER SCISSOR</h1>
    </header>
    <main>
        <section class="box-align">
            <div class="box" id="stone">
                <img src="https://img.icons8.com/color/96/rock.png" alt="Stone">
                <h3>Stone</h3>
            </div>
            <div class="box" id="paper">
                <img src="https://img.icons8.com/color/96/paper.png" alt="Paper">
                <h3>Paper</h3>
            </div>
            <div class="box" id="scissors">
                <img src="https://img.icons8.com/color/96/scissors.png" alt="Scissors">
                <h3>Scissors</h3>
            </div>
        </section>
        <section class="status">
            <div class="status-box" id="msg">Pick your move to start!</div>
        </section>
        <section class="scoreboard">
            <div class="score">
                <p id="user-score">0</p>
                <p>You</p>
            </div>
            <div class="score">
                <p id="comp-score">0</p>
                <p>Comp</p>
            </div>
        </section>
        <div class="reset-container">
            <button id="reset-btn">Reset Game</button>
        </div>
    </main>

    <footer>
        <p>Made for Fun | Stone Paper Scissors</p>
    </footer>

    <script src="Script1.js"></script>
</body>
</html>
